      '<div class="layout">'
      + '<div class="col"><div class="stack">'
      +   '<div class="head"><div class="l"><span style="color:#2563eb">' + svg('theater', 28) + '</span><h2>Genres</h2></div>'
      +   '<button class="snd" data-act="sound" aria-label="' + (soundOn ? 'Disable sound' : 'Enable sound') + '"><span style="color:' + (soundOn ? '#2563eb' : '#9ca3af') + '">' + svg(soundOn ? 'volOn' : 'volOff', 20) + '</span></button></div>'
      +   '<div class="glist"><div class="ggrid">' + genreBtns + '</div></div>'
      +   '<div><h3 class="sec">Film Length</h3><div class="lenbox"><div class="lengrid">' + lenBtns + '</div></div></div>'
      +   '<div><h3 class="sec">Era</h3><div class="elist">' + eraBtns + '</div></div>'
      +   '<div>' + statsHtml + '</div>'
      + '</div></div>'
      + '<div class="col mid">'
      +   '<div class="titleblock"><h1>Impossible</h1><h2>Movies</h2><div class="dots" style="--d:' + (dots || '#2563eb') + '">' + (dots ? '<i></i><i></i><i></i>' : '<i style="background:#2563eb"></i><i style="background:#60a5fa;opacity:1"></i><i style="background:#93c5fd;opacity:1"></i>') + '</div></div>'
      +   '<div class="cardwrap"><div class="card"><div class="in">' + cardInner + '</div></div></div>'
      +   '<button class="go' + (gen && !st.busy ? ' on' : '') + '" data-act="go"' + (!gen || st.busy ? ' disabled' : '') + '><span>' + (st.busy ? svg('sparkles', 24) : svg('film', 24)) + (st.busy ? 'Generating...' : 'Impossible') + '</span></button>'
      + '</div>'
      + '<div class="col"><div class="rpanel">' + right + '</div></div>'
      + '</div>';
  }

  // ---------- Events (delegated, so the sidebar can scroll without losing state) ----------
  app.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const scroller = () => { const s = app.querySelector('.glist'); return s ? s.scrollTop : 0; };
    const keep = scroller();
    if (b.dataset.genre) { ctx(); snd.click(); st.genre = b.dataset.genre; st.result = null; }
    else if (b.dataset.length) { ctx(); snd.length(); st.length = b.dataset.length; st.result = null; }
    else if (b.dataset.era) { ctx(); const en = ERAS.find(x => x.name === b.dataset.era); snd.era(en.freq); st.era = b.dataset.era; st.result = null; }
    else if (b.dataset.act === 'stats') { ctx(); snd.click(); st.stats = !st.stats; }
    else if (b.dataset.act === 'reset') { ctx(); snd.whoosh(); resetUsed(); st.result = null; }
    else if (b.dataset.act === 'sound') {
      soundOn = !soundOn; try { localStorage.setItem('impossibleMoviesSoundEnabled', String(soundOn)); } catch (err) {}
      if (soundOn) { ctx(); setTimeout(snd.click, 100); }
    }
    else if (b.dataset.act === 'go') {
      if (!st.genre || st.busy) return;
      ctx(); snd.generate(); st.busy = true;
      setTimeout(() => {
        const res = generate(st.genre, st.length, st.era);
        st.result = res || { title:'Dictionary Exhausted', synopsis:'All unique word combinations for this genre have been used! Please reset the dictionary to continue.', year:new Date().getFullYear(), runtime:0, filmLength:st.length, era:st.era, isUnique:false };
        st.busy = false; render();
      }, 1500);
    }
    render();
    const s = app.querySelector('.glist'); if (s) s.scrollTop = keep;
  });
  app.addEventListener('mouseover', e => {
    const b = e.target.closest('.gbtn'); if (!b || b.contains(e.relatedTarget)) return;
    const g = GENRES.find(x => x.name === b.dataset.genre); if (g) { ctx(); snd.genre(g.freq); }
  });

  render();
})();
</script>
</body>
</html>
